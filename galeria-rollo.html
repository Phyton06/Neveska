frame:nth-child(even){transform:rotate(1.9deg);margin-top:24px}.frame:hover{transform:rotate(0) scale(1.025);z-index:1;box-shadow:0 14px 28px #000a}.photo{display:block;height:clamp(170px,52vw,280px);position:relative;overflow:hidden;background:#312b26}.photo img{width:100%;height:100%;display:block;object-fit:cover;filter:saturate(.83);transition:filter .25s,transform .4s}.frame:hover .photo img{filter:saturate(1);transform:scale(1.035)}.frame:nth-child(2) .photo img{object-position:38% center}.stamp{position:absolute;bottom:10px;left:12px;right:12px;display:flex;align-items:center;gap:7px;color:#211b17;font:700 11px "DM Sans",sans-serif;letter-spacing:.025em}.stamp .brand-icon{width:18px;height:18px;flex:none}.stamp .go{margin-left:auto;color:#87491f;font-size:17px}.frame.age .stamp{color:#713d27}.frame.age .photo:after{content:"18+";position:absolute;top:8px;right:8px;padding:5px 7px;background:#17120fe0;color:#f3d5b6;font:700 9px "DM Sans",sans-serif;letter-spacing:.09em}:focus-visible{outline:2px solid var(--rust);outline-offset:5px}

  <div class="veil" data-dialog hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="age-title" tabindex="-1"><h2 id="age-title">Contenido +18</h2><div class="actions"><button class="confirm" type="button" data-confirm>Tengo 18 años o más</button><button class="cancel" type="button" data-cancel>Salir</button></div></section></div>
  <script>
    (()=>{const veil=document.querySelector('[data-dialog]'),confirm=veil.querySelector('[data-confirm]'),cancel=veil.querySelector('[data-cancel]');let previousFocus=null;
      function close(){veil.hidden=true;document.body.style.overflow='';if(previousFocus)previousFocus.focus()}
      document.querySelectorAll('[data-onlyfans]').forEach(trigger=>trigger.addEventListener('click',event=>{event.preventDefault();previousFocus=trigger;veil.hidden=false;document.body.style.overflow='hidden';confirm.focus()}));
      confirm.addEventListener('click',()=>{close();window.open('https://onlyfans.com/', '_blank', 'noopener,noreferrer')});cancel.addEventListener('click',close);veil.addEventListener('click',event=>{if(event.target===veil)close()});
      document.addEventListener('keydown',event=>{if(veil.hidden)return;if(event.key==='Escape'){event.preventDefault();close()}if(event.key==='Tab'){const buttons=[confirm,cancel],i=buttons.indexOf(document.activeElement);if(event.shiftKey&&i===0){event.preventDefault();cancel.focus()}else if(!event.shiftKey&&i===buttons.length-1){event.preventDefault();confirm.focus()}}});
    })();
  </script>
