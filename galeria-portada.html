  <script>
    (()=>{const veil=document.querySelector('[data-dialog]'),confirm=veil.querySelector('[data-confirm]'),cancel=veil.querySelector('[data-cancel]');let previousFocus=null;
      function close(){veil.hidden=true;document.body.style.overflow='';if(previousFocus)previousFocus.focus()}
      document.querySelectorAll('[data-onlyfans]').forEach(trigger=>trigger.addEventListener('click',event=>{event.preventDefault();previousFocus=trigger;veil.hidden=false;document.body.style.overflow='hidden';confirm.focus()}));
      confirm.addEventListener('click',()=>{close();window.open('https://onlyfans.com/', '_blank', 'noopener,noreferrer')});cancel.addEventListener('click',close);veil.addEventListener('click',event=>{if(event.target===veil)close()});
      document.addEventListener('keydown',event=>{if(veil.hidden)return;if(event.key==='Escape'){event.preventDefault();close()}if(event.key==='Tab'){const buttons=[confirm,cancel],i=buttons.indexOf(document.activeElement);if(event.shiftKey&&i===0){event.preventDefault();cancel.focus()}else if(!event.shiftKey&&i===buttons.length-1){event.preventDefault();confirm.focus()}}});
    })();
  </script>
